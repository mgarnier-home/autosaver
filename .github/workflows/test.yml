name: Tests

# Lancé sur chaque pull request vers main et sur chaque push sur main (ce qui détecte une fusion
# cassée). La publication de l'image Docker est un workflow séparé, déclenché par un tag
# (publish.yml).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Annule une exécution en cours sur la même référence dès qu'un nouveau push arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test -race ./...
